name: CI
on:
  pull_request:
  workflow_call:
  push:
    tags: ['audit-courses-v*']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm validate:curriculum
      - run: pnpm validate:lessons
      - run: pnpm tasks:check
      - run: pnpm docs:check
      - run: pnpm scope:check
      - run: pnpm test
      - name: Select changed courses
        id: selection
        run: node --import tsx scripts/select-e2e-lessons.ts
  browser:
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        path: [root, project]
    env:
      LESSON_SELECTION: ${{ matrix.path == 'project' && needs.quality.outputs.selection || '{"lessons":[],"removed":[]}' }}
      VITE_BASE_PATH: ${{ matrix.path == 'project' && format('/{0}/', github.event.repository.name) || '/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - run: pnpm exec playwright install --with-deps chromium
      - if: matrix.path == 'project'
        run: pnpm test:e2e --project=chromium
      - if: matrix.path == 'root'
        run: pnpm test:e2e --project=chromium --grep @smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.path }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
